name: Feature request
description: A new command, MCP tool option, dashboard view or routing behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and where Fetchira gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How it could work. A CLI example or MCP call helps.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds tried
  - type: checkboxes
    id: pr
    attributes:
      label: Contribution
      options:
        - label: I can open a PR for this
